name: Dependency Validation
on:
  workflow_call:
    inputs:
      pr-author:
        required: true
        type: string
      projects-json:
        required: true
        type: string
      postgres-required:
        required: false
        type: boolean
        default: false
      policy-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ordinary-pr:
    if: inputs.pr-author != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record ordinary pull request no-op
        run: |
          {
            echo "## Dependency validation"
            echo
            echo "Ordinary pull request: dependency validation is a successful no-op."
          } >> "$GITHUB_STEP_SUMMARY"

  validate-projects:
    if: inputs.pr-author == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.project.timeout-minutes }}
    services:
      postgres:
        image: ${{ inputs.postgres-required && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gradcafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PIP_NO_CACHE_DIR: '1'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects-json) }}
    steps:
      - name: Configure opted-in disposable database
        if: inputs.postgres-required
        run: echo 'DATABASE_URL=postgresql://postgres@localhost:5432/gradcafe_test' >> "$GITHUB_ENV"

      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: matrix.project.ecosystem == 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.project.runtime-version }}

      - name: Set up Python
        if: startsWith(matrix.project.ecosystem, 'python-')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.project.runtime-version }}

      - name: Set up Java
        if: matrix.project.ecosystem == 'gradle'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: ${{ matrix.project.runtime-version }}

      - name: Check out dependency policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: minjungsung/.github
          ref: ${{ inputs.policy-ref }}
          path: .dependency-policy-source
          persist-credentials: false

      - name: Install actionlint
        if: matrix.project.ecosystem == 'github-actions'
        run: bash .dependency-policy-source/dependency-policy/scripts/install_actionlint.sh

      - name: Validate project
        env:
          PROJECT_JSON: ${{ toJSON(matrix.project) }}
        run: |
          PYTHONPATH=.dependency-policy-source/dependency-policy \
          python3 .dependency-policy-source/dependency-policy/scripts/run_project.py \
            --project-json "$PROJECT_JSON" \
            --repository-root "$GITHUB_WORKSPACE"
