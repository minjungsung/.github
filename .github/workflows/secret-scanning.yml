name: Secret Scanning
on:
  workflow_call:
    inputs:
      policy-ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  scan:
    name: secret-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out target history without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out scanner tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.policy-ref }}
          path: .secret-policy-source
          persist-credentials: false
      - name: Install checksum-verified scanners
        run: bash .secret-policy-source/dependency-policy/scripts/install_secret_scanners.sh
      - name: Scan with Gitleaks
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_BEFORE: ${{ github.event.before }}
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/scanner.toml"
          scan_range=HEAD^..HEAD
          if [ "$SCAN_EVENT" = pull_request ]; then
            scan_range="$SCAN_BASE..HEAD"
          elif [ "$SCAN_EVENT" = push ] && [ -n "$SCAN_BEFORE" ] && [ "$SCAN_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            scan_range="$SCAN_BEFORE..HEAD"
          elif [ "$SCAN_EVENT" = schedule ]; then
            scan_range=HEAD
          elif ! git rev-parse --verify HEAD^ > "$RUNNER_TEMP/scan-parent" 2>&1; then
            scan_range=HEAD
          fi
          gitleaks git . --log-opts="$scan_range" --config "$RUNNER_TEMP/scanner.toml" \
            --redact=100 --no-banner
      - name: Verify live secrets with TruffleHog
        if: success() || failure()
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_BEFORE: ${{ github.event.before }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          scan_options=(--max-depth=50)
          if [ "$SCAN_EVENT" = pull_request ]; then
            scan_options=(--since-commit="$SCAN_BASE")
          elif [ "$SCAN_EVENT" = push ] && [ -n "$SCAN_BEFORE" ] && [ "$SCAN_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            scan_options=(--since-commit="$SCAN_BEFORE")
          fi
          set +e
          trufflehog git file://. "${scan_options[@]}" --only-verified --fail --json \
            > "$RUNNER_TEMP/trufflehog-results.jsonl" 2> "$RUNNER_TEMP/trufflehog-errors.log"
          scanner_status=$?
          set -e
          python3 - "$RUNNER_TEMP/trufflehog-results.jsonl" <<'PY'
          import json, sys
          from pathlib import Path
          findings = sum(1 for line in Path(sys.argv[1]).read_text().splitlines() if json.loads(line).get('Verified'))
          print(f'Verified secret findings: {findings}')
          PY
          exit "$scanner_status"
