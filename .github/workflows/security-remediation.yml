name: Security Remediation
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-remediation
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.SECURITY_REPAIR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      repository: ${{ steps.plan.outputs.repository }}
      branch: ${{ steps.plan.outputs.branch }}
      default-branch: ${{ steps.plan.outputs.default-branch }}
      name: ${{ steps.plan.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select one bounded repair
        id: plan
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_MAINTENANCE_TOKEN }}
          POLICY_OWNER: ${{ github.repository_owner }}
          PYTHONPATH: dependency-policy
        run: |
          python3 dependency-policy/scripts/security_remediation.py plan \
            --owner "$POLICY_OWNER" --inventory dependency-policy/repositories.json \
            --output candidate.json --prompt repair-prompt.txt --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-plan
          path: |
            candidate.json
            repair-prompt.txt
          retention-days: 30
  repair:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: policy
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repair-plan
          path: evidence
      - name: Check out application without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.plan.outputs.repository }}
          ref: ${{ needs.plan.outputs.default-branch }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare npm dependency graph without publication credentials
        env:
          POLICY_REPOSITORY: ${{ needs.plan.outputs.name }}
          PYTHONPATH: policy/dependency-policy
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          from lib.models import load_inventory
          repo = load_inventory(Path('policy/dependency-policy/repositories.json')).repository(os.environ['POLICY_REPOSITORY'])
          for project in repo.projects:
              if project.ecosystem == 'npm':
                  result = subprocess.run(['npm', 'install', '--strict-peer-deps'], cwd=Path('target') / project.path)
                  if result.returncode: raise SystemExit(result.returncode)
          PY
      - name: Start isolated enterprise credential relay
        env:
          COMPANY_MODEL_CA_PEM: ${{ secrets.COMPANY_MODEL_CA_PEM }}
          COMPANY_MODEL_API_KEY: ${{ secrets.COMPANY_MODEL_API_KEY }}
          COMPANY_MODEL_RESPONSES_ENDPOINT: ${{ secrets.COMPANY_MODEL_RESPONSES_ENDPOINT }}
        run: |
          python3 - <<'PYTHON'
          import json, os, secrets, subprocess, time
          from urllib.request import urlopen
          local_key = secrets.token_hex(32)
          print('::add-mask::' + local_key)
          config = {'endpoint': os.environ['COMPANY_MODEL_RESPONSES_ENDPOINT'],
                    'credential': os.environ['COMPANY_MODEL_API_KEY'], 'local-key': local_key,
                    'ca-pem': os.environ.get('COMPANY_MODEL_CA_PEM', '')}
          # Root holds the real credential; the Action removes model sudo access.
          process = subprocess.Popen(['sudo', '-n', 'python3', 'policy/dependency-policy/scripts/model_gateway_relay.py'],
                                     stdin=subprocess.PIPE, stdout=subprocess.DEVNULL,
                                     stderr=subprocess.DEVNULL, start_new_session=True,
                                     env={'PATH': '/usr/bin:/bin'})
          process.stdin.write(json.dumps(config).encode())
          process.stdin.close()
          import socket
          for attempt in range(30):
              if process.poll() is not None:
                  raise SystemExit('Enterprise credential relay failed to start')
              try:
                  with socket.create_connection(('127.0.0.1', 8766), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Enterprise credential relay did not become ready')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('MODEL_RELAY_KEY=' + local_key + '\n')
          PYTHON
      - name: Repair vulnerable dependencies and compatibility
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5
        with:
          openai-api-key: ${{ env.MODEL_RELAY_KEY }}
          responses-api-endpoint: http://127.0.0.1:8766/responses
          model: ${{ vars.SECURITY_REPAIR_MODEL }}
          codex-version: '0.162.1'
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          working-directory: target
          prompt-file: evidence/repair-prompt.txt
          output-file: evidence/repair-result.md
      - name: Require narrow patch and actual project validation
        env:
          POLICY_REPOSITORY: ${{ needs.plan.outputs.name }}
          PYTHONPATH: policy/dependency-policy
        run: |
          python3 policy/dependency-policy/scripts/security_remediation.py validate-patch --root target
          python3 - <<'PY'
          import json, os, subprocess
          from dataclasses import asdict
          from pathlib import Path
          from lib.models import load_inventory
          repo = load_inventory(Path('policy/dependency-policy/repositories.json')).repository(os.environ['POLICY_REPOSITORY'])
          for project in repo.projects:
              payload = {k.replace('_','-'):v for k,v in asdict(project).items() if v is not None}
              subprocess.run(['python3','policy/dependency-policy/scripts/run_project.py','--project-json',json.dumps(payload),'--repository-root','target'],check=True)
          subprocess.run(['git','add','--all'],cwd='target',check=True)
          with open('evidence/repair.patch','wb') as patch:
              subprocess.run(['git','diff','--cached','--binary','HEAD'],cwd='target',stdout=patch,check=True)
          Path('evidence/base-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],cwd='target',text=True).strip())
          PY
      - name: Preserve successful repair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-repair
          path: evidence
          retention-days: 30
  publish:
    needs: [plan, repair]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: policy
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-repair
          path: evidence
      - name: Publish validated repair for independent hosted checks
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_MAINTENANCE_TOKEN }}
          PYTHONPATH: policy/dependency-policy
          POLICY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 policy/dependency-policy/scripts/publish_security_repair.py \
            --evidence evidence --owner "$POLICY_OWNER" \
            --inventory policy/dependency-policy/repositories.json
