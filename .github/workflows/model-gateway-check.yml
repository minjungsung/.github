name: Model Gateway Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start isolated enterprise credential relay
        env:
          COMPANY_MODEL_CA_PEM: ${{ secrets.COMPANY_MODEL_CA_PEM }}
          COMPANY_MODEL_API_KEY: ${{ secrets.COMPANY_MODEL_API_KEY }}
          COMPANY_MODEL_RESPONSES_ENDPOINT: ${{ secrets.COMPANY_MODEL_RESPONSES_ENDPOINT }}
        run: |
          python3 - <<'PYTHON'
          import json, os, secrets, subprocess, time
          from urllib.request import urlopen
          local_key = secrets.token_hex(32)
          print('::add-mask::' + local_key)
          config = {'endpoint': os.environ['COMPANY_MODEL_RESPONSES_ENDPOINT'],
                    'credential': os.environ['COMPANY_MODEL_API_KEY'], 'local-key': local_key,
                    'ca-pem': os.environ.get('COMPANY_MODEL_CA_PEM', '')}
          # Root holds the real credential; the Action removes model sudo access.
          process = subprocess.Popen(['sudo', '-n', 'python3', 'dependency-policy/scripts/model_gateway_relay.py'],
                                     stdin=subprocess.PIPE, stdout=subprocess.DEVNULL,
                                     stderr=subprocess.DEVNULL, start_new_session=True,
                                     env={'PATH': '/usr/bin:/bin'})
          process.stdin.write(json.dumps(config).encode())
          process.stdin.close()
          import socket
          for attempt in range(30):
              if process.poll() is not None:
                  raise SystemExit('Enterprise credential relay failed to start')
              try:
                  with socket.create_connection(('127.0.0.1', 8766), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Enterprise credential relay did not become ready')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('MODEL_RELAY_KEY=' + local_key + '\n')
          PYTHON
      - name: Verify cloud model execution without application code
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ env.MODEL_RELAY_KEY }}
          responses-api-endpoint: http://127.0.0.1:8766/responses
          model: ${{ vars.SECURITY_REPAIR_MODEL }}
          codex-version: '0.162.1'
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt: 'Do not use tools or read files. Reply with exactly CLOUD_MODEL_OK.'
          output-file: cloud-model-result.txt
      - name: Require completed model response
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          result = Path('cloud-model-result.txt').read_text().strip()
          if result != 'CLOUD_MODEL_OK':
              raise SystemExit('Cloud model response did not match the connection contract')
          print('Cloud model execution verified')
          PYTHON
