name: Dependency Maintenance
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require fleet authentication
        env:
          APP_ID: ${{ vars.DEPENDENCY_APP_ID }}
          APP_KEY: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          MAINTENANCE_TOKEN: ${{ secrets.DEPENDENCY_MAINTENANCE_TOKEN }}
        run: |
          if [ -z "$MAINTENANCE_TOKEN" ] && { [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; }; then
            echo '::error::Fleet credentials are missing. Configure a repository-scoped GitHub App installation or a dedicated maintenance token.'
            exit 1
          fi
      - name: Create short-lived installation token
        id: app-token
        if: vars.DEPENDENCY_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.DEPENDENCY_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Diagnose credential and security API access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.DEPENDENCY_MAINTENANCE_TOKEN }}
          POLICY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess, re
          for label, endpoint in [('authentication', 'user'), ('central-alerts', f"repos/{os.environ['POLICY_OWNER']}/.github/dependabot/alerts?state=open&per_page=1")]:
              response = subprocess.run(['gh', 'api', '-i', endpoint], capture_output=True, text=True)
              status = re.search(r'HTTP/[^ ]+ ([0-9]+)', response.stdout)
              scopes = re.search(r'(?im)^x-oauth-scopes: (.*)$', response.stdout)
              print(json.dumps({'probe': label, 'exit-code': response.returncode, 'http-status': status.group(1) if status else None, 'oauth-scopes': scopes.group(1).strip() if scopes else None}))
              if response.returncode:
                  # Print only GitHub's static API error message, never credentials or payloads.
                  for line in response.stderr.splitlines():
                      if line.startswith('gh: '): print(line)
          PYCODE
      - name: Reconcile active repositories and refresh stale updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.DEPENDENCY_MAINTENANCE_TOKEN }}
          POLICY_OWNER: ${{ github.repository_owner }}
          PYTHONPATH: dependency-policy
        run: |
          python3 dependency-policy/scripts/maintain_dependencies.py \
            --owner "$POLICY_OWNER" --output maintenance-evidence.json --apply
      - name: Record coverage and unresolved security alerts
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('maintenance-evidence.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not p.exists():
                  summary.write('Fleet maintenance did not produce evidence; authentication or discovery failed.\n')
              else:
                  report = json.loads(p.read_text())
                  summary.write('# Dependency maintenance\n\n')
                  summary.write(f"Coverage complete: {report['coverage-complete']}\n\n")
                  for repo in report['repositories']:
                      summary.write(f"- {repo['repository']}: policy={repo.get('policy-status')}, open alerts={len(repo['alerts'])}, alert access={repo.get('alert-status', 'available')}\n")
                      for pr in repo['pull-requests']:
                          summary.write(f"  - PR {pr['number']}: {pr['status']}\n")
          PY
      - name: Preserve maintenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-maintenance-evidence
          path: maintenance-evidence.json
          if-no-files-found: error
          retention-days: 30
